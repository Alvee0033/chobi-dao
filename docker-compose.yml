version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chobi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a unique production secret}
      POSTGRES_DB: ${POSTGRES_DB:-chobi_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chobi} -d ${POSTGRES_DB:-chobi_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: elestio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER to a unique storage username}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD to a unique production secret}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: elestio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-chobi-photos};
      /usr/bin/mc anonymous set none local/${S3_BUCKET:-chobi-photos};
      exit 0;
      "

  ai-service:
    build:
      context: ./apis/apps/ai-service
      dockerfile: Dockerfile
    restart: always
    environment:
      INSIGHTFACE_MODEL: ${INSIGHTFACE_MODEL:-buffalo_s}
      ORT_INTRA_THREADS: 2
      ORT_INTER_THREADS: 1
      DET_SIZE: ${DET_SIZE:-640}
      MAX_IMAGE_DIM: ${MAX_IMAGE_DIM:-2400}
    volumes:
      - insightface_models:/root/.insightface
    expose:
      - "8000"

  api-gateway:
    build:
      context: ./apis
      dockerfile: infra/docker/api-gateway.Dockerfile
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-chobi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chobi_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set a unique JWT_ACCESS_SECRET (32+ characters)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a unique JWT_REFRESH_SECRET (32+ characters)}
      LIVENESS_TOKEN_SECRET: ${LIVENESS_TOKEN_SECRET:?Set a unique LIVENESS_TOKEN_SECRET (32+ characters)}
      SEARCH_SESSION_SECRET: ${SEARCH_SESSION_SECRET:?Set a unique SEARCH_SESSION_SECRET (32+ characters)}
      TRUST_PROXY: ${TRUST_PROXY:?Set TRUST_PROXY to the Coolify proxy IP/CIDR}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      UDDOKTAPAY_BASE_URL: ${UDDOKTAPAY_BASE_URL:-https://sandbox.uddoktapay.com/api}
      UDDOKTAPAY_API_KEY: ${UDDOKTAPAY_API_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL to the public web application URL}
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL to the public API URL}
      AI_SERVICE_URL: http://ai-service:8000
      STORAGE_DRIVER: minio
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-chobi-photos}
      S3_FORCE_PATH_STYLE: "true"
      LOCAL_STORAGE_DIR: /storage/uploads
    volumes:
      - local_storage:/storage/uploads
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./apis
      dockerfile: infra/docker/worker.Dockerfile
    restart: always
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-chobi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chobi_db}?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-chobi-photos}
      LOCAL_STORAGE_DIR: /storage/uploads
    volumes:
      - local_storage:/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api-gateway:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    expose:
      - "3000"
    depends_on:
      - api-gateway

  admin:
    build:
      context: ./admin-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_BASE_URL:?Set API_BASE_URL to the public API URL}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3100
    expose:
      - "3100"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  minio_data:
  local_storage:
  insightface_models:
