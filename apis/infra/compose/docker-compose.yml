version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: framefind
      POSTGRES_PASSWORD: framefind
      POSTGRES_DB: framefind
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framefind"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api-gateway:
    build:
      context: ../../
      dockerfile: infra/docker/api-gateway.Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://framefind:framefind@postgres:5432/framefind?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      LIVENESS_TOKEN_SECRET: dev-liveness-secret
      SEARCH_SESSION_SECRET: dev-search-secret
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/v1/auth/google/callback}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      AI_SERVICE_URL: http://ai-service:8000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
      S3_BUCKET: framefind
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: ../../
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://framefind:framefind@postgres:5432/framefind?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
      S3_BUCKET: framefind
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-service:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile
    environment:
      INSIGHTFACE_MODEL: ${INSIGHTFACE_MODEL:-buffalo_s}
      ORT_INTRA_THREADS: 2
      ORT_INTER_THREADS: 1
      DET_SIZE: ${DET_SIZE:-640}
      MAX_IMAGE_DIM: ${MAX_IMAGE_DIM:-2400}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1200M
        reservations:
          cpus: '0.5'
          memory: 400M
    ports:
      - "8000:8000"

volumes:
  pg_data:
  minio_data:
